<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>K-Paw Music · 프롬프트 컴파일러</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F5F8; --inset:#F6F8FA;
    --line:#E4E8EC; --text:#233240; --muted:#7C8994;
    --navy:#1F3B57; --navy-deep:#16293B; --navy-hi:#2A4E70;
    --gold:#C2984C; --gold-hi:#D3AA5E; --gold-soft:rgba(194,152,76,.12);
    --green:#5C9A6B;
    --display:'Quicksand',system-ui,sans-serif;
    --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    --mono:ui-monospace,Menlo,Consolas,monospace;
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(194,152,76,.08), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--body); line-height:1.6;
    padding:max(18px,env(safe-area-inset-top)) 18px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:660px; margin:0 auto}

  header{text-align:center; padding:8px 0 20px}
  .logo{width:min(150px,44vw); height:auto; display:block; margin:0 auto}
  .tagline{color:var(--muted); font-size:14px; margin:4px 0 0}

  .card{background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); padding:20px;
    box-shadow:0 1px 2px rgba(22,41,59,.04), 0 10px 26px rgba(31,59,87,.05)}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media (max-width:460px){.grid{grid-template-columns:1fr}}
  .field{display:flex; flex-direction:column; gap:6px}
  .field.full{grid-column:1 / -1}
  label{font-size:12px; font-weight:700; color:var(--muted);
    letter-spacing:.4px; text-transform:uppercase}
  .hint{font-size:12px; color:var(--muted); font-weight:400; text-transform:none; letter-spacing:0}
  select, input[type=text]{
    appearance:none; -webkit-appearance:none; width:100%;
    background:#FFFFFF; color:var(--text); font-family:var(--body); font-size:16px;
    border:1px solid var(--line); border-radius:11px; padding:12px 13px;
  }
  select{
    padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none'><path d='M1 1l5 5 5-5' stroke='%237C8994' stroke-width='1.6' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 14px center;
  }
  input[type=text]::placeholder{color:#A7B2BC}
  select:focus-visible, input:focus-visible{outline:2px solid var(--gold); outline-offset:1px}

  .compile{
    grid-column:1 / -1; margin-top:6px; position:relative;
    background:linear-gradient(180deg,var(--navy-hi),var(--navy));
    color:#FFFFFF; font-family:var(--display); font-weight:700; font-size:18px;
    border:none; border-radius:13px; padding:15px; cursor:pointer;
    box-shadow:0 6px 16px rgba(31,59,87,.18); transition:box-shadow .25s,transform .06s;
  }
  .compile:hover{box-shadow:0 8px 26px rgba(31,59,87,.28)}
  .compile:active{transform:translateY(1px)}
  .compile:focus-visible{outline:2px solid var(--gold); outline-offset:3px}

  #out{margin-top:22px; display:none}
  #out.show{display:block; animation:rise .4s ease both}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1;transform:none}}

  .resolved{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
  .chip{background:var(--surface2); border:1px solid var(--line);
    color:var(--navy); font-size:13px; font-weight:600;
    padding:6px 12px; border-radius:999px}
  .chip .k{color:var(--gold)}
  .chip.pl{color:var(--gold)}
  .chip.inst, .chip.style{background:var(--gold-soft); border-color:rgba(194,152,76,.4)}

  .note{background:var(--gold-soft); border:1px solid rgba(194,152,76,.4);
    color:var(--navy-deep); font-size:13.5px; border-radius:12px; padding:12px 14px; margin-bottom:16px}

  .sec-label{font-family:var(--display); font-weight:700; font-size:13px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--gold);
    margin:22px 2px 10px}
  .sec-label:first-child{margin-top:4px}

  .block{background:var(--surface); border:1px solid var(--line);
    border-radius:13px; padding:14px; margin-bottom:12px}
  .block-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
  .block-title{font-size:12px; font-weight:700; letter-spacing:.4px;
    text-transform:uppercase; color:var(--muted)}
  .copy{background:var(--surface2); color:var(--navy); border:1px solid var(--line);
    font-family:var(--body); font-size:12.5px; font-weight:600;
    padding:6px 12px; border-radius:9px; cursor:pointer; white-space:nowrap;
    transition:background .15s,color .15s}
  .copy:hover{background:#E7ECF0}
  .copy:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .copy.done{background:var(--green); color:#FFFFFF; border-color:var(--green)}

  .content{font-family:var(--mono); font-size:13px; color:var(--text);
    white-space:pre-wrap; word-break:break-word; margin:0;
    background:var(--inset); border:1px solid var(--line);
    border-radius:9px; padding:11px 12px}
  .content.ko{font-family:var(--body); font-size:14px}
  .settings{display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--muted)}
  .settings b{color:var(--navy); font-weight:700}
  .tags{display:flex; flex-wrap:wrap; gap:6px}
  .tag{background:var(--inset); border:1px solid var(--line); color:var(--navy);
    font-size:12.5px; padding:4px 9px; border-radius:8px}

  .toggle{gap:4px}
  .switch{display:flex; align-items:center; gap:9px; cursor:pointer;
    font-size:14px; font-weight:600; color:var(--navy); text-transform:none; letter-spacing:0}
  .switch input{width:20px; height:20px; accent-color:var(--gold); cursor:pointer}
  .presets{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .preset{background:var(--inset); border:1px solid var(--line); color:var(--navy);
    font-family:var(--body); font-size:12.5px; font-weight:600;
    padding:5px 11px; border-radius:999px; cursor:pointer; transition:background .15s,border-color .15s}
  .preset:hover{background:var(--gold-soft); border-color:var(--gold)}
  .preset:focus-visible{outline:2px solid var(--gold); outline-offset:1px}

  .downloads{margin-top:18px; display:flex; gap:10px; flex-wrap:wrap}
  .ghost{background:transparent; color:var(--navy); border:1px solid var(--navy);
    font-family:var(--body); font-weight:600; font-size:13.5px;
    padding:10px 16px; border-radius:11px; cursor:pointer}
  .ghost:hover{background:var(--gold-soft); border-color:var(--gold)}

  footer{color:var(--muted); font-size:12px; text-align:center;
    margin-top:34px; line-height:1.7}
  footer b{color:var(--gold)}

  @media (prefers-reduced-motion:reduce){
    #out.show{animation:none}
    .compile{transition:none}
  }
</style>
</head>

function compileKpaw(animal, situation, detail, emotion, age="default", leadKey="default", styleKey="ambient", arcKey="auto", number=1, beatless=false){

  const amod=MODS.animal[animal]||MODS.animal.dog;

  const style=STYLES[styleKey]||STYLES.ambient;

  let soundDesign=`${lead.lead} as the clear lead voice, with ${style.instruments} kept gently underneath`;
  if(base.sound_design) soundDesign+=`, ${base.sound_design}`;
  if(ambience) soundDesign+=`, ${ambience} (always below the music)`;
  if(amod.add_sound.length) soundDesign+=`, ${amod.add_sound.join(", ")}`;

  // Styles: 스타일(장르) 태그 → 리드 → 스타일 악기 → 공통 무드
  const styles=`${style.tag}, ${beatless?DNA.suno.beatlessTags+", ":""}${lead.tag}, ${style.instruments}, ${DNA.suno.moodTails}`;
  const exclude=`${DNA.suno.excludeBase}, ${style.exclude_add}${beatless?", "+DNA.suno.beatlessExclude:""}`;

  const detailRaw=(detail||"").trim();
  const tr=toEnglishDetail(detailRaw);
  const detailEn=tr.en;
  const sceneText = detailEn ? `${base.scene} ${detailEn}` : base.scene;

  const situationPrompt=`Scene: ${sceneText}\nDog Emotion: ${base.dog_emotion}\nMusical Goal: ${base.musical_goal}\nSound Design: ${soundDesign}.\nComposition: ${composition}, key ${DNA.keys.primary}, smooth harmonic movement, no strong climax.\nEnding: ${base.ending}`;

  const genrePre = styleKey==="smooth_jazz" ? "Smooth Jazz " : styleKey==="bossa" ? "Bossa Nova " : "";
  const sitPrefix = SIT_PREFIX[situation] || `${sit.label} Music`;
  const animalWord = animal==="dog" ? "Dogs" : "Cats";
  const trackNo = String(Math.max(1, parseInt(number,10)||1)).padStart(3,"0");
  const enTitle=`${genrePre}${sitPrefix} for ${animalWord} @ K-Paw Signature No.${trackNo}`;
  const animalKo=animal==="dog"?"강아지":"고양이";
  const sceneVisual=sceneText.split(".")[0];
  const imgBreeds = animal==="cat" ? IMG.catBreeds : IMG.dogBreeds;
  const buildImg = () => `${pick(IMG.shots)} of an adorable, heart-meltingly cute real ${pick(imgBreeds)} ${pick(IMG.pose)}, in a scene of ${sceneVisual.toLowerCase()}. ${pick(IMG.light)}, ${pick(IMG.palette)}, ${pick(IMG.lenses)}. Photorealistic candid photograph, soft fluffy realistic fur, wholesome cozy heart-warming mood, high detail, 4k, 16:9, no text. Not a golden retriever. Not an illustration, not a cartoon, not anime, not a 3D render.`;
  const ytTitle=krTitle(situation,sit,animalKo);

  // 재즈가 덜 적합한 고불안 상황 안내
  const jazz=(styleKey==="smooth_jazz"||styleKey==="bossa");
  const styleWarning = (jazz && sit.high_fear)
    ? "재즈·보사노바는 즉흥성·복잡성 때문에 극도로 불안한 상황(천둥·병원)에는 덜 적합할 수 있습니다. 이 상황에선 'K-Paw 앰비언트'가 더 안전합니다. 굳이 재즈를 쓴다면 지금처럼 브라스·불협화음이 배제된 아주 단순한 형태로만 유지하세요."
    : "";

  return {
    inputs:{animal,situation,detail:detailRaw,detail_en:detailEn,number:trackNo,emotion,age,lead:leadKey,style:styleKey,arc:arcResolved},
    resolved:{bpm,key:DNA.keys.primary,target_minutes:dmod.target_minutes,animal_note:amod.note||"",lead_ko:lead.label_ko,style_ko:style.label_ko,style_warning:styleWarning,arc_ko:arc.label_ko,arc_auto:(arcKey==="auto"),detail_en:detailEn,detail_warn:tr.leftover,beatless:beatless},
    suno:{styles,exclude_styles:exclude,weirdness:(beatless?DNA.suno.beatlessWeirdness:DNA.suno.weirdness),style_influence:(beatless?DNA.suno.beatlessStyleInfluence:DNA.suno.style_influence),instrumental:DNA.suno.instrumental,situation_prompt:situationPrompt,song_title:enTitle},
    images:{
      gpt_image:buildImg(),
      leonardo:buildImg(),
      flux:buildImg()
    },
    youtube:{title:ytTitle,description:description(ytTitle,sceneText,animalKo),hashtags:hashtags(situation,animalKo,styleKey),thumbnail_text:thumbText(situation),seo_keywords:seoKeywords(situation,animalKo,styleKey),playlist:sit.playlist,made_for_kids:false,ai_disclosure:true}
  };
}

/* ================= UI ================= */
const KO = {
  animal:{dog:"강아지",cat:"고양이"},
  emotion:{default:"기본",calm:"평온",mild_anxiety:"약한 불안",fear:"공포·무서움",sleepy:"졸림",curious:"호기심"},
  age:{default:"기본",puppy:"퍼피",adult:"성견",senior:"노령"},
  situation:{car_ride:"차량 이동",home_alone:"집에 혼자",with_owner:"집사와 함께",thunder:"천둥·폭풍",vet_visit:"동물병원",sleep:"수면"}
};
const $ = id => document.getElementById(id);
function fill(sel, entries, selected){
  sel.innerHTML="";
  for(const [val,text] of entries){
    const o=document.createElement("option"); o.value=val; o.textContent=text;
    if(val===selected) o.selected=true; sel.appendChild(o);
  }
}
function koPairs(obj, map){ return Object.keys(obj).map(k=>[k, map[k]||k]); }

fill($("animal"), koPairs(MODS.animal, KO.animal), "dog");
fill($("age"), koPairs(MODS.age, KO.age), "default");
fill($("emotion"), koPairs(MODS.emotion, KO.emotion), "default");
fill($("situation"), Object.keys(SITUATIONS).map(k=>[k, KO.situation[k]||SITUATIONS[k].label]), "with_owner");
fill($("style"), Object.keys(STYLES).map(k=>[k, STYLES[k].label_ko]), "ambient");
fill($("arc"), [["auto","자동 (상황 맞춤)"]].concat(Object.keys(ARCS).map(k=>[k, ARCS[k].label_ko])), "auto");
const leadEntries=[["default",LEADS.default.label_ko],["random","🎲 랜덤 (매번 다른 악기)"]]
  .concat(Object.keys(LEADS).filter(k=>k!=="default").map(k=>[k,LEADS[k].label_ko]));
fill($("lead"), leadEntries, "default");

function renderPresets(){
  const list = DETAIL_PRESETS[$("situation").value] || [];
  $("presets").innerHTML = list.map(([ko,en])=>
    `<button type="button" class="preset" data-en="${encodeURIComponent(en)}">${esc(ko)}</button>`).join("");
  $("presets").querySelectorAll(".preset").forEach(b=>{
    b.addEventListener("click", ()=>{ $("detail").value = decodeURIComponent(b.dataset.en); });
  });
}
$("situation").addEventListener("change", renderPresets);
renderPresets();

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function block(title, content, opts={}){
  const ko = opts.ko ? " ko" : "";
  const copyText = opts.copy ?? content;
  const body = opts.html || `<pre class="content${ko}">${esc(content)}</pre>`;
  return `<div class="block">
    <div class="block-head"><span class="block-title">${title}</span>
      <button class="copy" data-copy="${encodeURIComponent(copyText)}">복사</button></div>
    ${body}</div>`;
}

function render(r){
  const s=r.suno, y=r.youtube, im=r.images;
  const catNote = r.resolved.animal_note ? `<div class="note">🐈 ${esc(r.resolved.animal_note)}</div>` : "";
  const styleNote = r.resolved.style_warning ? `<div class="note">🎷 ${esc(r.resolved.style_warning)}</div>` : "";
  const detailNote = r.resolved.detail_warn ? `<div class="note">✏️ 일부 한글이 자동 변환되지 않아 프롬프트에서 제거했습니다. 더 정확히 하려면 위의 추천을 선택하거나 영어로 입력하세요.</div>` : "";
  const beatlessNote = r.resolved.beatless ? `<div class="note">🚫🥁 비트리스 모드: 드럼·비트 태그를 제외하고 BPM 숫자를 뺐습니다. Suno에서 <b>Weirdness ${s.weirdness}%, Style Influence ${s.style_influence}%</b>로 맞추면 드럼이 잘 안 섞입니다. 그래도 새면 스템에서 드럼 트랙을 빼세요.</div>` : "";
  const detailChip = r.resolved.detail_en ? `<span class="chip inst">✏️ ${esc(r.resolved.detail_en)}</span>` : "";
  const tags = y.hashtags.map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const seo = y.seo_keywords.map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const settings = `<div class="settings"><span>Weirdness <b>${s.weirdness}%</b></span><span>Style Influence <b>${s.style_influence}%</b></span><span>Instrumental <b>${s.instrumental?"ON":"OFF"}</b></span></div>`;

  $("out").innerHTML =
    `<div class="resolved">
       <span class="chip style">🎼 ${esc(r.resolved.style_ko)}</span>
       <span class="chip inst">🎵 ${esc(r.resolved.lead_ko)}</span>
       <span class="chip">🌙 ${esc(r.resolved.arc_ko)}${r.resolved.arc_auto?' · 자동':''}</span>
       ${detailChip}
       <span class="chip"><span class="k">♩</span> ${r.resolved.beatless?'무박 · rubato':r.resolved.bpm+' BPM'}</span>
       <span class="chip">${esc(r.resolved.key)}</span>
       <span class="chip">3시간 · 2:30~3:00 클립</span>
       <span class="chip pl">▶ ${esc(y.playlist)}</span>
     </div>${styleNote}${beatlessNote}${detailNote}${catNote}
     <div class="sec-label">Suno 프롬프트</div>
     ${block("Situation Prompt (설명 칸에 붙여넣기)", s.situation_prompt)}
     ${block("Styles", s.styles)}
     ${block("Exclude Styles", s.exclude_styles)}
     ${block("설정", "", {html:settings, copy:`Weirdness ${s.weirdness}% / Style Influence ${s.style_influence}% / Instrumental ${s.instrumental?"ON":"OFF"}`})}
     ${block("곡 제목", s.song_title)}
     <div class="sec-label">이미지 프롬프트 (실사 · 매번 다르게)</div>
     ${block("GPT-Image", im.gpt_image)}
     ${block("Leonardo", im.leonardo)}
     ${block("Flux", im.flux)}
     <div class="sec-label">YouTube</div>
     ${block("제목", y.title, {ko:true})}
     ${block("썸네일 문구", y.thumbnail_text, {ko:true})}
     ${block("설명", y.description, {ko:true})}
     ${block("해시태그", "", {html:`<div class="tags">${tags}</div>`, copy:y.hashtags.join(" ")})}
     ${block("SEO 키워드", "", {html:`<div class="tags">${seo}</div>`, copy:y.seo_keywords.join(", ")})}
     <div class="downloads">
       <button class="ghost" id="dlKpaw">전체 결과 JSON 저장</button>
       <button class="ghost" id="dlEngine">영상엔진용 config 저장</button>
     </div>`;
  $("out").classList.add("show");

  $("out").querySelectorAll(".copy").forEach(btn=>{
    btn.addEventListener("click", ()=>copy(decodeURIComponent(btn.dataset.copy), btn));
  });
  $("dlKpaw").onclick = ()=>download(`kpaw_${r.inputs.situation}_${r.inputs.style}_${r.inputs.lead}.json`, JSON.stringify(r,null,2));
  $("dlEngine").onclick = ()=>download(`${r.inputs.situation}.engine.json`, JSON.stringify({
    clips:["./assets/music/track_01.mp3","./assets/music/track_02.mp3","./assets/music/track_03.mp3"],
    visual:"./assets/bg/scene.png", mascot:"./assets/brand/mascot.png",
    title:y.title, channel_text:"K-Paw",
    hours:Math.round(r.resolved.target_minutes/60*100)/100, out:`./out/${r.inputs.situation}`
  },null,2));

  $("out").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth", block:"start"});
}

function copy(text, btn){
  const done = ()=>{ const o=btn.textContent; btn.textContent="복사됨 ✓"; btn.classList.add("done");
    setTimeout(()=>{btn.textContent=o; btn.classList.remove("done");},1400); };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else fallbackCopy(text,done);
}
function fallbackCopy(text, done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta); done();
}
function download(name, text){
  const b=new Blob([text],{type:"application/json"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}

$("go").addEventListener("click", ()=>{
  let leadKey=$("lead").value;
  if(leadKey==="random"){ const pool=Object.keys(LEADS).filter(k=>k!=="default"); leadKey=pool[Math.floor(Math.random()*pool.length)]; }
  const r=compileKpaw($("animal").value,$("situation").value,$("detail").value,$("emotion").value,$("age").value,leadKey,$("style").value,$("arc").value,$("number").value,$("beatless").checked);
  render(r);
});
</script>
</body>
